<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width initial-scale=1.0"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <link rel="stylesheet" href="./assets/css/playspace.css"/>
    <title>Driptuch</title>
  </head>
  <body>
    <div class="outer-field">
      <div id="menu" class="menu">
	<div id="menu-div-a" class="menu-div"></div>
	<div id="menu-div-b" class="menu-div"></div>
	<div id="menu-div-c" class="menu-div"></div>
      </div>
      <div id="menu-panel" class="menu-panel">
	<div class="menu-panel-item menu-panel-item-a">
	  <h3 class="menu-panel-h2">High Score</h3>
	  <div id="high-score-display" class="high-score-display">0</div>
	</div>
	<div class="menu-panel-item menu-panel-item-b">
	  <h3 class="menu-panel-h2">Theme</h3>
	  <select id="theme-select">
	    <option>Light</option>
	    <option>Dark</option>
	    <option selected>Peachy</option>
	    <option>Dune</option>
	    <option>Cerise</option>
	    <option>Olive</option>
	  </select>
	</div>
	<div class="menu-panel-item menu-panel-item-c">
	  <h3 class="menu-panel-h2">Iris</h3>
	  <select id="iris-select">
	    <option>Almond</option>
	    <option selected>Rose</option>
	    <option>Vert</option>
	    <option>Vio</option>
	    <option>Bleu</option>
	  </select>
	</div>
	<div class="menu-panel-item menu-panel-item-d">
	  <div id="jardin-arch" class="jardin-arch">
	    <a id="thinejardin-link" class="thinejardin-link" href="https://www.gekofroot.github.io/thinejardin">
	      <h6>Thinejardin</h6>
	    </a>
	  </div>
	</div>
      </div>
      <div id="main-field-wrapper" class="main-field-wrapper">
	<div id="field-areas" class="field-areas">
	  <div id="points-field-area" class="points-field-area">
	    <div id="points-display" class="display-field-item">0</div>
	  </div>
	  <div id="droplets-field-area" class="droplets-field-area">
	    <div id="droplets-display" class="display-field-item">0</div>
	  </div>
	</div>
	<div id="main-field-border" class="main-field-border">
	  <div id="main-field" class="main-field">
	    <div id="main-field-shader" class="main-field-shader"></div>
	    <div id="surface-shader" class="surface-shader"></div>
	  </div>
	</div>
	<button id="play" class="play" type="button" value="play">
	  <div id="play-icon" class="play-icon"></div>
	  <div id="play-shader" class="play-shader"></div>
	  <div id="fill-shader" class="fill-shader"></div>
	</button>
      </div>
      <div id="booster-field" class="booster-field">
	<div id="booster-item-wrapper" class="item-wrapper booster-item-wrapper">
	</div>
      </div>
      <div id="orb-field" class="orb-field">
	<div id="orb-item-wrapper" class="item-wrapper orb-item-wrapper">
	</div>
      </div>
    <script src="./assets/js/playspace.js"></script>
  </body>
</html>
